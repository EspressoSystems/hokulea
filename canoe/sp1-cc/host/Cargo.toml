[package]
version = "0.1.0"
name = "canoe-sp1-cc-host"
edition = "2021"

[dependencies]
rsp-primitives.workspace = true
sp1-cc-client-executor.workspace = true
sp1-cc-host-executor.workspace = true

alloy-primitives.workspace = true
alloy-sol-types.workspace = true
bincode.workspace = true

# sp1-cc-host-executor (pinned to reth-1.9.3-sp1-6.1.0) uses the older
# alloy v1.x API. Until succinctlabs/sp1-contract-call ships a release that
# matches the reth rev used by kona-node/v1.5.0 (alloy v2.0.4), pin these
# deps to v1 here rather than picking up the workspace's v2.0.4 versions.
alloy-rpc-client = { version = "=1.6.3", default-features = false }
alloy-rpc-types = { version = "=1.6.3", default-features = false }
anyhow.workspace = true
async-trait.workspace = true
canoe-bindings.workspace = true
canoe-provider.workspace = true

# misc:
tracing.workspace = true

# sp1
sp1-hypercube.workspace = true
sp1-primitives.workspace = true
sp1-sdk.workspace = true
